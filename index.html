<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESTINY'S CAT | The Decision Book</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Lora:ital,wght@0,400;0,700;1,400&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Dynamic CSS Background -->
    <div class="dynamic-bg" id="dynamicBg">
        <div class="particles" id="particles"></div>
        <div class="ambient-glow"></div>
    </div>
    
    <main class="container">
        <!-- Theme Toggles at top right of the container -->
        <div class="theme-toggle-container">
            <!-- 18+ Mode Toggle -->
            <div class="toggle-wrapper" title="โหมด 18+ (ปากแจ๋ว)">
                <input type="checkbox" id="rudeSwitch" class="theme-checkbox rude-checkbox">
                <label for="rudeSwitch" class="theme-label rude-label">
                    <span class="icon flame">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 11-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 2.5z"></path>
                        </svg>
                    </span>
                    <span class="icon sparkle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3l1.912 5.813a2 2 0 001.275 1.275L21 12l-5.813 1.912a2 2 0 00-1.275 1.275L12 21l-1.912-5.813a2 2 0 00-1.275-1.275L3 12l5.813-1.912a2 2 0 001.275-1.275L12 3z"></path>
                        </svg>
                    </span>
                    <div class="toggle-ball rude-ball"></div>
                </label>
            </div>

            <!-- Day/Night Theme Toggle -->
            <div class="toggle-wrapper" title="สลับธีม สว่าง/มืด">
                <input type="checkbox" id="themeSwitch" class="theme-checkbox">
                <label for="themeSwitch" class="theme-label">
                    <span class="icon moon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </span>
                    <span class="icon sun">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                    </span>
                    <div class="toggle-ball"></div>
                </label>
            </div>
        </div>
        <header>
            <p class="header-tagline">-- The Oracle Speaks --</p>
            <h1 class="title-en">DESTINY'S CAT</h1>
            <div class="header-divider"></div>
            <p class="subtitle">No hesitations. No regrets.<br>จงตั้งสมาธิ... ที่นี่มีแต่คำตอบที่เด็ดขาด</p>
        </header>

        <section class="interaction-area">
            <div class="input-group">
                <input type="text" id="questionInput" class="question-input" placeholder="พิมพ์คำถามที่สงสัย..." autocomplete="off">
            </div>

            <!-- The Full Card Image with Crystal Ball Glow Overlay and Reflection -->
            <div class="fortune-teller-scene" id="catButton">
                <img src="fortune_cat.png" alt="Fortune Teller Cat" class="mystic-cat-img" id="catImage">
                <!-- This glow is positioned exactly over the crystal ball in the image -->
                <div class="magic-glow-overlay" id="crystalGlow"></div>
                <!-- Glossy Foil Reflection for 3D Tilt -->
                <div class="glossy-reflection" id="cardReflection"></div>
                <!-- Magic explosion burst centered on cat -->
                <div class="magic-explosion hidden" id="magicExplosion"></div>
            </div>
            
            <p class="instruction">แตะที่ลูกแก้ววิเศษเพื่อเริ่มการทำนาย</p>
        </section>
    </main>

    <!-- Dramatic Flash Overlay -->
    <div class="flash-bang hidden" id="flashBang"></div>

    <!-- Overlay for the Tarot Card reveal -->
    <div class="overlay hidden" id="answerOverlay">
        <div class="overlay-backdrop"></div>
        
        <div class="scene">
            <div class="tarot-card" id="tarotCard">
                <!-- Back of the card -->
                <div class="card-face card-back">
                    <div class="card-border">
                        <div class="card-pattern"></div>
                    </div>
                </div>
                
                <!-- Front of the card (The Answer) -->
                <div class="card-face card-front">
                    <div class="card-border">
                        <button class="close-btn" id="closeBtn">&times;</button>
                        <div class="card-content">
                            <h4 class="card-title">คำทำนายของคุณ</h4>
                            <p class="question-echo" id="questionDisplay"></p>
                            
                            <div class="answer-reveal">
                                <p class="answer-text" id="answerText"></p>
                            </div>
                            
                            <button class="ask-again-btn" id="askAgainBtn">รับคำทำนายอีกครั้ง</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Magical Cursor -->
    <div class="magic-cursor" id="magicCursor"></div>

    <script src="script.js"></script>
</body>
</html>
